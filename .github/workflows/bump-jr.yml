name: bump jr

# Point jr.rb at a jr release without anybody editing eight lines by hand.
#
# The release workflow in kmoneil/jr sends `jr-released` here once the archives
# and their checksums are published. Everything after that is these three jobs,
# and nothing reaches main that has not been installed and run first.
#
# **The rewrite is committed and pushed to a branch before anything verifies
# it**, which is the whole shape of this workflow and was learned the hard way.
# Homebrew's setup-homebrew action symlinks this repository into the taps
# directory and runs `git checkout -B main` on it, so an uncommitted rewrite in
# the working tree is gone before brew reads the formula. The first version of
# this workflow rewrote, then verified, then committed: the verification passed
# against the reverted formula, installed the previous release, and the run went
# red only because there was nothing left to commit. A gate that passes on the
# wrong input is worse than no gate, so the change is committed first and the
# thing verified is a ref rather than a working tree.
#
# There is no pull request. A PR opened with the workflow's own GITHUB_TOKEN
# triggers no other workflow, so the brew checks would not run on it: it would
# look gated and be less gated than the verify job below. If the record of a PR
# is worth more than that, the change is a token that can open one, not a
# weaker gate.

on:
  repository_dispatch:
    types: [jr-released]
  workflow_dispatch:
    inputs:
      tag:
        description: the jr release to point at, such as v0.13.2
        required: true

permissions:
  contents: write

# Two releases in quick succession queue rather than race. Cancelling would
# leave a branch pushed and never landed.
concurrency:
  group: bump-jr
  cancel-in-progress: false

jobs:
  prepare:
    name: rewrite and push a branch
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: which release
        id: which
        run: |
          tag="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          [ -n "$tag" ] || { echo "no tag was given"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asked to bump to $tag"

      # Before trusting the tool, run its own tests. They cover the refusals,
      # which a healthy release never produces and which are the whole reason
      # the rewrite is a script rather than a sed line.
      - name: the script's own tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: rewrite the formula
        id: bump
        run: python3 .github/scripts/bump-jr.py --tag "${{ steps.which.outputs.tag }}"

      # A re-run of a release dispatches again. The second one has nothing to
      # do, rather than something to undo.
      - name: nothing to do
        if: steps.bump.outputs.changed != 'true'
        run: echo "jr.rb already points at ${{ steps.bump.outputs.version }}"

      - name: commit it to a branch
        id: push
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          branch="bump/jr-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Written to a file rather than a heredoc: a heredoc inside an
          # indented block scalar carries its indentation into the message.
          {
            printf 'chore(jr): bump to %s\n\n' "$VERSION"
            printf 'Four URLs and four checksums, written by\n'
            printf '.github/scripts/bump-jr.py and landed by the bump-jr\n'
            printf 'workflow.\n\n'
            printf 'Every digest was read from the release checksums.txt and\n'
            printf 're-derived from the archive downloaded from the URL this\n'
            printf 'formula now carries; all four agree. Build provenance was\n'
            printf 'verified on all four archives against kmoneil/jr. The\n'
            printf 'formula was audited, installed and tested on a macOS runner\n'
            printf 'from this commit, and the installed binary was asserted to\n'
            printf 'report %s rather than merely to agree with itself.\n\n' "$VERSION"
            printf 'Release notes:\n'
            printf 'https://github.com/kmoneil/jr/releases/tag/%s\n' "$TAG"
          } > "$RUNNER_TEMP/commit-message.txt"
          git checkout -b "$branch"
          git add jr.rb
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          # A previous attempt at this version may have failed and left its
          # branch behind, which is deliberate: it is the evidence. But this
          # checkout has never heard of it, so --force-with-lease refuses with
          # "stale info" and the retry cannot start. Fetching it first is what
          # gives the lease something to be about; without the fetch the choice
          # is between a bare --force and a workflow that cannot be re-run.
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: audit, install, test the rewrite
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      # The branch, not the default ref. This is the reason the branch exists:
      # what gets audited and installed has to be the rewrite itself, and the
      # only way to be sure of that is to check it out by name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: ./.github/actions/verify-formula
        with:
          # Both, and the second is what makes the first trustworthy.
          # setup-homebrew will replace this checkout with GITHUB_SHA, which on
          # a dispatch is main; formula-ref puts the bump's jr.rb back
          # afterwards, and expect-version fails the job if anything about that
          # did not work rather than installing the previous release quietly.
          formula-ref: ${{ needs.prepare.outputs.sha }}
          expect-version: ${{ needs.prepare.outputs.version }}

  land:
    name: fast-forward main
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A fast-forward, so main only ever gains the commit that was verified.
      # If main moved while the macOS runner was installing, this is rejected
      # and the job goes red: the formula that was verified is no longer the
      # formula main holds, and the answer is another run rather than a force.
      #
      # The branch is deleted on success and kept on failure, where it is the
      # evidence of what was tried.
      - name: land the verified commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git push origin "${SHA}:main"
          git push origin --delete "${BRANCH}"
          echo "main is at ${SHA}"
