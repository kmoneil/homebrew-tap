name: bump yaml

# Point yaml.rb at a release of kmoneil/yaml.zig's `yaml` command: four
# binaries, and the digest of each.
#
# The release workflow in kmoneil/yaml.zig sends `yaml-released` here once the
# binaries and SHA256SUMS are published. The jobs that rewrite,
# verify and land the formula are in bump-formula.yml, shared by every formula
# this tap keeps current; this says when to run them, and for which.

on:
  repository_dispatch:
    types: [yaml-released]
  workflow_dispatch:
    inputs:
      tag:
        description: the yaml release to point at, such as v0.1.0
        required: true

permissions:
  contents: write

# As in bump-jr.yml: two releases in quick succession queue rather than race,
# and the group is yaml's alone.
concurrency:
  group: bump-yaml
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/bump-formula.yml
    with:
      formula: yaml
      repo: kmoneil/yaml.zig
      # yaml.zig's release attests every asset it publishes, from v0.1.0, its first.
      attested-by: kmoneil/yaml.zig/.github/workflows/release.yml
      tag: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
