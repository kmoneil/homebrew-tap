name: verify the formula
description: >
  Audit, install and test jr.rb as it stands in the checkout, on a machine with
  Homebrew.

# One definition of "the formula is good", because there are two callers and
# were nearly two copies. brew.yml asks the question of a branch somebody
# pushed; bump-jr.yml asks it of a branch a script wrote. A second copy would
# drift, and the half that drifted would be the one guarding the automated
# change nobody watches.

inputs:
  formula-ref:
    description: >
      A commit whose jr.rb should be verified, restored into the working tree
      after setup-homebrew has finished with it.

      Needed because setup-homebrew does not verify what you checked out. Its
      main.sh empties GITHUB_WORKSPACE, moves the tap into it, symlinks the
      taps entry at it, then runs `git checkout --force -B main FETCH_HEAD`
      against a fetch of **GITHUB_SHA**. For a pull_request that is the merge
      commit, so brew.yml gets exactly the formula the PR proposes and has
      always been right. For a workflow_dispatch it is the head of the branch
      the workflow was dispatched on, so a bump's own commit is discarded
      however it was checked out. Restoring one file afterwards is the smallest
      thing that survives all of that.

      Empty means verify whatever setup-homebrew left, which is what brew.yml
      wants.
    required: false
    default: ""
  expect-version:
    description: >
      The version the installed binary must report. Empty means "whatever this
      formula says", which is all brew.yml can ask: it verifies a branch and
      has nothing else to compare against. A bump knows the answer before it
      starts and passes it, which is the only way this can catch a formula that
      is not the one the caller thought it was verifying.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

    - name: restore the formula being verified
      if: inputs.formula-ref != ''
      # After setup-homebrew, never before: it force-checks-out GITHUB_SHA over
      # whatever is here, so anything written first is gone. One file, from a
      # commit that is already on the remote, and the expect-version step below
      # is what proves it arrived.
      shell: bash
      run: |
        git fetch --depth=1 origin '${{ inputs.formula-ref }}'
        git checkout '${{ inputs.formula-ref }}' -- jr.rb
        git --no-pager diff --stat HEAD -- jr.rb || true
        grep -o 'jr-full_[0-9.]*_darwin_arm64' jr.rb | head -1

    - name: this checkout is the tap
      # setup-homebrew has already symlinked the checkout into the taps
      # directory, so there is nothing to install and this only says so out
      # loud. It used to `cp -R "$GITHUB_WORKSPACE" "$tap"`, which with that
      # symlink in place copied the checkout into itself and left a stray
      # homebrew-tap/ inside the repository.
      #
      # The symlink is also why setup-homebrew's `git checkout -B main` reaches
      # the working tree: the tap it resets is this checkout. Anything that
      # needs to survive that has to be committed before this action runs,
      # which is why bump-jr pushes a branch and verifies the branch.
      shell: bash
      run: |
        tap="$(brew --repository)/Library/Taps/kmoneil/homebrew-tap"
        test -L "$tap" || { echo "$tap is not a symlink; setup-homebrew changed"; exit 1; }
        resolved="$(cd "$tap" && pwd -P)"
        expected="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        [ "$resolved" = "$expected" ] || {
          echo "the tap resolves to $resolved, not this checkout at $expected"
          exit 1
        }
        test -f "$tap/jr.rb"
        brew tap

    # First, because it catches a syntax error in a second rather than after
    # a download.
    - name: brew style
      shell: bash
      run: brew style kmoneil/tap/jr

    - name: brew audit
      shell: bash
      run: brew audit --strict --online kmoneil/tap/jr

    - name: brew install
      shell: bash
      run: brew install --verbose kmoneil/tap/jr

    # The formula's own test block: the binary reports the version the formula
    # claims, and `jr schema --limit 3` exits 3 with parseable stdout.
    - name: brew test
      shell: bash
      run: brew test --verbose kmoneil/tap/jr

    - name: the installed binary answers
      shell: bash
      run: |
        jr version --format tsv
        jr --help > /dev/null

    - name: the binary is the version the caller asked for
      if: inputs.expect-version != ''
      # The formula's own test asserts the binary matches the formula, and a
      # formula that was quietly reverted still satisfies that: it is wrong and
      # self-consistent. This is the assertion that catches it, and it exists
      # because on 2026-09-04 a bump to 0.13.2 verified 0.13.1 and passed,
      # after setup-homebrew reset away the uncommitted rewrite.
      shell: bash
      run: |
        want='${{ inputs.expect-version }}'
        got=$(jr version --format tsv | awk -F'\t' '$1=="@release"{print $2}')
        printf 'expected %s, installed %s\n' "$want" "$got"
        [ "$want" = "$got" ] || {
          echo "the formula that was verified is not the one the caller meant"
          exit 1
        }
